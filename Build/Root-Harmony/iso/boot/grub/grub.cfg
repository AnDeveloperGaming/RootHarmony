# 1. Initialize the display engine modules
insmod vbe
insmod vga
insmod gfxterm
insmod gfxmenu

# 2. Force GRUB out of legacy text display mode
terminal_output gfxterm

# 3. Load font rendering and image utility modules
insmod font
insmod png

# 4. Load the custom binary font pack file
loadfont /boot/grub/themes/RootHarmonyTheme/font.pf2

# 5. Point GRUB directly to your modded theme layout file
set theme=/boot/grub/themes/RootHarmonyTheme/theme.txt
export theme

# =======================================================
# MENU ENTRIES
# =======================================================

menuentry "Root Harmony" --class os {
    multiboot /boot/kern
    boot
}
